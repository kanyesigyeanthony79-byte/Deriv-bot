<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#10251d"><title>Signal Performance · Deriv Signal Assistant</title>
<style>
:root{color-scheme:dark;--bg:#0b1712;--panel:#14251d;--line:#2c4939;--txt:#eef5ef;--muted:#a8b9ad;--gold:#d5a83d}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(160deg,#10251d,#09120e 70%);color:var(--txt);font:14px system-ui,sans-serif}
main{max-width:1000px;margin:auto;padding:20px 14px 44px}a{color:var(--gold)}h1{font-size:24px;margin:0 0 5px}h2{font-size:16px;margin:20px 0 9px}.muted{color:var(--muted);font-size:12px;line-height:1.55}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:9px;margin:14px 0}.card{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:13px}.label{font-size:10px;color:var(--muted)}.value{font-size:23px;font-weight:800;margin-top:5px}
.wrap{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:13px}table{width:100%;border-collapse:collapse;font-size:12px;white-space:nowrap}th,td{text-align:left;padding:9px;border-bottom:1px solid var(--line)}th{color:var(--muted);font-weight:650}.note{padding:12px;border-left:3px solid var(--gold);background:#1a281e;border-radius:8px;font-size:12px;line-height:1.55;margin-top:14px}
</style></head><body><main>
<p><a href="./">← Back to dashboard</a></p><h1>Strategy-version performance</h1>
<div class="muted" id="generated">Loading the latest collector report…</div>
<div class="grid" id="totals"></div>
<h2>Overall delivered-signal outcomes</h2><div class="wrap"><table><thead><tr><th>TP2</th><th>Stopped</th><th>Stopped after TP1</th><th>Expired</th><th>Pending</th><th>TP1 only</th><th>Ambiguous</th><th>Decisive TP2 rate</th></tr></thead><tbody id="outcomes"></tbody></table></div>
<div id="sections"></div>
<div class="note" id="method"></div>
</main><script>
const reportUrl="./strategy_version_performance_report.json";
function el(tag,cls,text){const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n}
function table(title,rows){const section=el("section");section.append(el("h2","",title));const wrap=el("div","wrap"),t=el("table"),head=el("thead"),hr=el("tr");["Group","Signals","TP2","Stopped","SL after TP1","Expired","Pending","TP1 only","Ambiguous","TP2 rate*"].forEach(x=>hr.append(el("th","",x)));head.append(hr);t.append(head);const body=el("tbody");(rows||[]).forEach(r=>{const tr=el("tr");[r.key,r.signals,r.outcomes.tp2_hit,r.outcomes.stopped,r.outcomes.stopped_after_tp1,r.outcomes.expired,r.outcomes.pending,r.outcomes.tp1_hit,r.outcomes.ambiguous,r.decisiveTp2Rate===null?"—":r.decisiveTp2Rate+"%"].forEach(v=>tr.append(el("td","",String(v??0))));body.append(tr)});t.append(body);wrap.append(t);section.append(wrap);return section}
fetch(reportUrl+"?v="+Date.now(),{cache:"no-store"}).then(r=>{if(!r.ok)throw Error("Report not published yet");return r.json()}).then(d=>{
document.getElementById("generated").textContent="Generated: "+d.generatedAt+" · Delivered signals only for performance groupings.";
const totals=document.getElementById("totals");[
["JOURNAL RECORDS",d.totals.journalRecords],["TELEGRAM DELIVERED",d.totals.telegramDelivered],["VERSION TAGGED",d.totals.versionTagged],["LEGACY / UNVERSIONED",d.totals.legacyUnversioned],["DECISIVE TP2 RATE",d.overall.decisiveTp2Rate===null?"—":d.overall.decisiveTp2Rate+"%"]
].forEach(([k,v])=>{const c=el("div","card");c.append(el("div","label",k),el("div","value",String(v)));totals.append(c)});
const o=d.overall.outcomes;const tr=el("tr");[o.tp2_hit,o.stopped,o.stopped_after_tp1,o.expired,o.pending,o.tp1_hit,o.ambiguous,d.overall.decisiveTp2Rate===null?"—":d.overall.decisiveTp2Rate+"%"].forEach(v=>tr.append(el("td","",String(v))));document.getElementById("outcomes").append(tr);
const root=document.getElementById("sections");[
["By strategy version",d.byVersion],["By category",d.byCategory],["By market",d.byMarket],["By direction",d.byDirection],["By score band",d.byScoreBand],["Version × category",d.byVersionCategory],["Version × market",d.byVersionMarket]
].forEach(([name,rows])=>root.append(table(name,rows)));
document.getElementById("method").textContent=d.methodology.decisiveTp2Rate+". "+d.methodology.note+" Expired, pending, TP1-only, partial-after-TP1 and ambiguous signals are shown separately and are not counted as decisive wins or losses.";
}).catch(e=>{document.getElementById("generated").textContent=e.message+" · The report appears after the next successful collector run.";});
</script></body></html>
