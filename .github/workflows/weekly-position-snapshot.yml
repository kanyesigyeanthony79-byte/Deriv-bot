name: Weekly Position Context Snapshot

on:
  push:
    branches:
      - fix/weekly-position-warmup
    paths:
      - ".github/workflows/weekly-position-snapshot.yml"

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout experiment branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check analysis syntax
        run: node --check market_quality.js && node --check multi_timeframe_engine.js && node --check multi_timeframe_collector.js
      - name: Collect a non-alerting live snapshot
        run: node multi_timeframe_collector.js
        env:
          MTF_TELEGRAM_ALERTS: "false"
      - name: Upload snapshot for inspection
        uses: actions/upload-artifact@v4
        with:
          name: weekly-position-context-snapshot
          path: |
            multi_timeframe_data.json
            multi_timeframe_dashboard.json
            multi_timeframe_journal.json
          if-no-files-found: error
          retention-days: 3
