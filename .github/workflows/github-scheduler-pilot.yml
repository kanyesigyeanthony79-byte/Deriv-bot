name: GitHub Scheduler Pilot (No Deriv Calls)
run-name: "[schedule-pilot] ${{ github.event.schedule || github.event_name }}"

on:
  # Mirrors the two Cloudflare dispatch offsets: minute 1 and minute 4
  # of each five-minute cycle. This pilot does not run production scanners.
  schedule:
    - cron: "1-59/5 * * * *"
    - cron: "4-59/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-scheduler-pilot
  cancel-in-progress: false

jobs:
  record-scheduler-event:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Record schedule event without contacting Deriv or Telegram
        env:
          SCHEDULE_EXPRESSION: ${{ github.event.schedule || 'manual-test' }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const record = {
            observedAt: new Date().toISOString(),
            eventName: process.env.EVENT_NAME,
            scheduleExpression: process.env.SCHEDULE_EXPRESSION,
            runId: process.env.RUN_ID,
            runAttempt: process.env.RUN_ATTEMPT,
            refName: process.env.REF_NAME,
            purpose: 'scheduler-only pilot; no Deriv, Telegram, KV, or MT5 calls'
          };
          fs.writeFileSync('scheduler-pilot-event.json', JSON.stringify(record, null, 2) + '\n');
          console.log(JSON.stringify(record));
          NODE

      - name: Preserve scheduler event evidence
        uses: actions/upload-artifact@v4
        with:
          name: github-scheduler-pilot-${{ github.run_id }}
          path: scheduler-pilot-event.json
          if-no-files-found: error
          retention-days: 7
