name: Research Candle Collector (No Alerts)
run-name: "[research-only] Candle collection - ${{ github.event_name }}"

on:
  schedule:
    # Offset from quarter-hour boundaries to reduce GitHub scheduler congestion.
    - cron: "11,26,41,56 * * * *"
  workflow_dispatch:

permissions:
  contents: write

# Research outputs use dedicated files; no production journals or dashboards are written.
# This independent group prevents frequent production dispatches from replacing
# a pending research schedule run.
concurrency:
  group: deriv-research-candle-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Collect candles with all delivery and execution paths disabled
        run: node multi_timeframe_collector.js
        env:
          MTF_TELEGRAM_ALERTS: "false"
          STRATEGY_COMPARISON_TELEGRAM_ALERTS: "false"
          MT5_TRADE_REPORTING_ENABLED: "false"
          MT5_EXECUTION_QUEUE_ENABLED: "false"
          RESEARCH_ONLY_MODE: "true"
          RESEARCH_MTF_DATA_FILE: "research_multi_timeframe_data.json"

      - name: Archive lower-timeframe research candles
        run: node lower_tf_entry_research.js
        env:
          RESEARCH_FILE_PREFIX: "research_"
          RESEARCH_MTF_DATA_FILE: "research_multi_timeframe_data.json"

      - name: Run common-assumption replay when data is ready
        run: node lower_tf_common_assumption_replay.js
        env:
          RESEARCH_FILE_PREFIX: "research_"

      - name: Run EXP-01 common-assumption matched replay
        run: node exp01_matched_replay.js
        env:
          RESEARCH_FILE_PREFIX: "research_"
          RESEARCH_MTF_DATA_FILE: "research_multi_timeframe_data.json"

      - name: Run separate paired EXP-01 entry-policy replay
        run: node exp01_paired_replay_runner.js
        env:
          RESEARCH_FILE_PREFIX: "research_"
          RESEARCH_MTF_DATA_FILE: "research_multi_timeframe_data.json"

      - name: Run EXP-01 candidate opportunity overlap replay
        run: node exp01_candidate_opportunity_replay.js
        env:
          RESEARCH_MTF_DATA_FILE: "research_multi_timeframe_data.json"

      - name: Persist research observations and journals
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research_multi_timeframe_data.json research_lower_tf_research_candles.json research_lower_tf_entry_research_report.json research_lower_tf_common_assumption_replay_report.json research_exp01_matched_replay_report.json research_exp01_paired_replay_report.json research_exp01_candidate_opportunity_report.json research_*_forward_shadow_journal.json
          if ! git diff --cached --quiet; then
            git commit -m "Update isolated scheduled research observations"
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then exit 0; fi
              sleep 2
            done
            exit 1
          fi

      - name: Upload collection snapshot
        uses: actions/upload-artifact@v4
        with:
          name: scheduled-research-observation-data
          path: research_multi_timeframe_data.json
          if-no-files-found: error
          retention-days: 7
