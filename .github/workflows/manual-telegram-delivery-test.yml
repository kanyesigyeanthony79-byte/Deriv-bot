name: Manual Research Shadow Telegram route test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research-shadow-telegram-test:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Validate research shadow secrets and endpoint
        env:
          TELEGRAM_WORKER_URL: ${{ secrets.TELEGRAM_WORKER_URL }}
          SIGNAL_API_KEY: ${{ secrets.SIGNAL_API_KEY }}
        run: |
          test -n "$TELEGRAM_WORKER_URL" || { echo "Missing TELEGRAM_WORKER_URL secret"; exit 1; }
          test -n "$SIGNAL_API_KEY" || { echo "Missing SIGNAL_API_KEY secret"; exit 1; }
          node -e 'const u = new URL(process.env.TELEGRAM_WORKER_URL); if (u.protocol !== "https:") process.exit(1); console.log("Existing Telegram Worker base URL is valid HTTPS; shadow route will be derived from it.");'

      - name: Send one clearly labelled shadow-route commissioning test
        env:
          TELEGRAM_WORKER_URL: ${{ secrets.TELEGRAM_WORKER_URL }}
          SIGNAL_API_KEY: ${{ secrets.SIGNAL_API_KEY }}
        run: |
          node <<'NODE'
          // Match hosted_scanner.js: reuse the existing Worker base URL and derive its shadow-only route.
          const url = new URL("/shadow/research", process.env.TELEGRAM_WORKER_URL).toString();
          const apiKey = process.env.SIGNAL_API_KEY;
          const timestamp = new Date().toISOString();
          const signalId = "ROUTE-TEST-" + timestamp.replace(/[^A-Za-z0-9._:-]/g, "-");

          // These are deliberately synthetic validation values, not a market setup.
          // The message labels itself as a test and explicitly says no trade was executed.
          const payload = {
            source: "RESEARCH_SHADOW",
            event: "new_signal",
            paper: true,
            live: false,
            status: "SHADOW",
            signalId,
            strategyId: "M15_M5_EMA_PULLBACK",
            strategyLabel: "ROUTE COMMISSIONING TEST — NOT A MARKET SIGNAL",
            marketId: "R_25",
            market: "TEST ONLY — NOT A MARKET SIGNAL",
            direction: "BUY",
            entry: 100,
            stopLoss: 99,
            tp1: 101,
            tp2: 102,
            entryTimeframe: "TEST",
            setupTimeframe: "TEST",
            confirmationTimeframe: "TEST"
          };

          (async () => {
            const response = await fetch(url, {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                "X-API-Key": apiKey
              },
              body: JSON.stringify(payload),
              signal: AbortSignal.timeout(15000)
            });
            const result = await response.json().catch(() => ({}));
            if (!response.ok || result.success !== true) {
              console.error("Research shadow Telegram delivery was not confirmed. HTTP status:", response.status);
              console.error("Worker response:", JSON.stringify(result));
              process.exit(1);
            }
            console.log("RESEARCH_SHADOW_TELEGRAM_DELIVERY_CONFIRMED");
            console.log("Signal ID:", signalId);
            console.log("HTTP status:", response.status);
            console.log("Worker result:", result.message || "success");
            console.log("Timestamp:", timestamp);
            console.log("No market scan, MT5 order, or live trade was executed.");
          })().catch(error => {
            console.error("Research shadow Telegram test failed:", error.name || "network_error");
            process.exit(1);
          });
          NODE
