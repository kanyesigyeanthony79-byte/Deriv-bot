name: Scanner Watchdog

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/scanner-watchdog.yml"
  schedule:
    - cron: "3-59/5 * * * *"
  workflow_run:
    workflows: ["Multi-Timeframe Data Collector", "Deriv Market Monitor"]
    types: [completed]
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: deriv-scanner-watchdog
  cancel-in-progress: false

jobs:
  monitor-and-recover:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check collector and signal-scanner health; recover stale workflows
        uses: actions/github-script@v7
        with:
          script: |
            const workflows = [
              { id: 417618869, name: "Multi-Timeframe Data Collector" },
              { id: 417087054, name: "Deriv Market Monitor" },
              // GitHub accepts the workflow filename as workflow_id. Keep a
              // longer stale threshold than its 15-minute schedule to avoid
              // dispatching a duplicate just before the next scheduled run.
              // Research collection must be judged by native schedule events only.
              // Do not auto-dispatch it: a manual recovery can hide a broken schedule.
              { id: "research-candle-collector.yml", name: "Research Candle Collector (No Alerts)", staleAfterMs: 25 * 60 * 1000, autoRecover: false }
            ];
            const branch = "main";
            const defaultStaleAfterMs = 10 * 60 * 1000;
            const recoveryCooldownMs = 10 * 60 * 1000;
            const now = Date.now();

            for (const workflow of workflows) {
              const staleAfterMs = workflow.staleAfterMs || defaultStaleAfterMs;
              const response = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: workflow.id,
                branch,
                per_page: 30
              });
              const runs = response.data.workflow_runs || [];
              const latest = runs[0];

              if (!latest) {
                if (workflow.autoRecover === false) {
                  core.warning(`${workflow.name}: no runs found; automatic recovery is disabled so native schedule health remains visible.`);
                  continue;
                }
                core.warning(`${workflow.name}: no runs found; dispatching recovery.`);
                await github.rest.actions.createWorkflowDispatch({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  workflow_id: workflow.id,
                  ref: branch
                });
                continue;
              }

              const runAgeMs = now - Date.parse(latest.created_at);
              if (latest.status === "queued" || latest.status === "in_progress") {
                if (Number.isFinite(runAgeMs) && runAgeMs > staleAfterMs) {
                  if (workflow.autoRecover === false) {
                    core.warning(`${workflow.name}: run #${latest.run_number} has been ${latest.status} for ${Math.round(runAgeMs / 60000)} minutes; no automatic dispatch because native schedule evidence must remain unmasked.`);
                    continue;
                  }
                  core.warning(`${workflow.name}: run #${latest.run_number} has been ${latest.status} for ${Math.round(runAgeMs / 60000)} minutes; cancelling the stuck run and dispatching one recovery.`);
                  await github.rest.actions.cancelWorkflowRun({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    run_id: latest.id
                  });
                  await github.rest.actions.createWorkflowDispatch({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    workflow_id: workflow.id,
                    ref: branch
                  });
                } else {
                  core.notice(`${workflow.name}: run #${latest.run_number} is ${latest.status}; no duplicate dispatched.`);
                }
                continue;
              }

              const recentRecovery = runs.find(run =>
                run.event === "workflow_dispatch" &&
                Number.isFinite(Date.parse(run.created_at)) &&
                now - Date.parse(run.created_at) < recoveryCooldownMs
              );
              if (recentRecovery) {
                core.warning(`${workflow.name}: a recovery dispatch (#${recentRecovery.run_number}) occurred within the last 10 minutes; suppressing another dispatch to avoid a retry loop.`);
                continue;
              }

              const lastActivity = Date.parse(latest.updated_at || latest.created_at);
              const ageMs = now - lastActivity;
              const stale = !Number.isFinite(lastActivity) || ageMs > staleAfterMs;
              const failed = latest.conclusion !== "success";

              if (stale || failed) {
                const reason = failed
                  ? `latest run concluded ${latest.conclusion || "without a conclusion"}`
                  : `latest run has not completed recently (${Math.round(ageMs / 60000)} minutes since last activity)`;
                if (workflow.autoRecover === false) {
                  core.warning(`${workflow.name}: ${reason}; automatic recovery is disabled to preserve native schedule evidence.`);
                  continue;
                }
                core.warning(`${workflow.name}: ${reason}; dispatching recovery.`);
                await github.rest.actions.createWorkflowDispatch({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  workflow_id: workflow.id,
                  ref: branch
                });
              } else {
                core.notice(`${workflow.name}: healthy; latest run #${latest.run_number} succeeded ${Math.round(ageMs / 60000)} minutes ago.`);
              }
            }

      - name: Audit scheduled scanner cadence (schedule events only)
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const path = require("path");
            const targets = [
              { id: 417618869, name: "Multi-Timeframe Data Collector", event: "workflow_dispatch", label: "[cloudflare_scheduler]", gapThresholdMinutes: 7 },
              { id: 417087054, name: "Deriv Market Monitor", event: "workflow_dispatch", label: "[cloudflare_scheduler]", gapThresholdMinutes: 7 },
              // This workflow uses GitHub's native 15-minute schedule, not the
              // Cloudflare external-dispatch mechanism used by the two scanners.
              { id: "research-candle-collector.yml", name: "Research Candle Collector (No Alerts)", event: "schedule", gapThresholdMinutes: 22 }
            ];
            const reports = [];
            for (const target of targets) {
              const response = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner, repo: context.repo.repo,
                workflow_id: target.id, branch: "main", event: target.event, per_page: 100
              });
              const runs = (response.data.workflow_runs || [])
                .filter(run => run.event === target.event && (!target.label || String(run.display_title || "").includes(target.label)))
                .sort((a, b) => Date.parse(b.created_at) - Date.parse(a.created_at))
                .slice(0, 20);
              const times = runs.map(run => Date.parse(run.run_started_at || run.created_at)).filter(Number.isFinite);
              const gaps = times.slice(1).map((time, i) => Math.round((times[i] - time) / 60000));
              const report = {
                workflow: target.name, event: target.event, runsInspected: runs.length,
                successful: runs.filter(run => run.conclusion === "success").length,
                failedOrCancelled: runs.filter(run => run.conclusion && run.conclusion !== "success").length,
                medianIntervalMinutes: gaps.length ? gaps.slice().sort((a,b)=>a-b)[Math.floor(gaps.length/2)] : null,
                gapsOverThreshold: gaps.filter(minutes => minutes > target.gapThresholdMinutes).length,
                gapThresholdMinutes: target.gapThresholdMinutes,
                insufficientEvidence: runs.length < 3,
                runs: runs.map(run => ({ id: run.id, createdAt: run.created_at, startedAt: run.run_started_at, conclusion: run.conclusion }))
              };
              reports.push(report);
              core.summary.addHeading(target.name + " — " + (target.event === "schedule" ? "GitHub scheduled runs" : "Cloudflare external dispatches"));
              core.summary.addTable([
                [{data:"Runs inspected",header:true},{data:"Successful",header:true},{data:"Failed/cancelled",header:true},{data:"Median interval (min)",header:true},{data:"Gaps over threshold",header:true}],
                [String(report.runsInspected),String(report.successful),String(report.failedOrCancelled),String(report.medianIntervalMinutes ?? "—"),String(report.gapsOverThreshold)]
              ]);
              if (report.insufficientEvidence) core.summary.addQuote("Insufficient " + target.event + " run history to assess cadence reliably.");
            }
            core.summary.addQuote("Only the configured event type is counted for each workflow. Manual dispatches, recovery dispatches, push runs and workflow_run executions are excluded from scheduled-cadence evidence.");
            await core.summary.write();
            fs.writeFileSync(path.join(process.env.RUNNER_TEMP, "scanner-schedule-audit.json"), JSON.stringify({ generatedAt:new Date().toISOString(), reports }, null, 2));
      - name: Preserve scheduled cadence audit
        uses: actions/upload-artifact@v4
        with:
          name: scanner-schedule-audit
          path: ${{ runner.temp }}/scanner-schedule-audit.json
          if-no-files-found: error
          retention-days: 14
