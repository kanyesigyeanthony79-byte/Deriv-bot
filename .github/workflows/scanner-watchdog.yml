name: Scanner Watchdog

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/scanner-watchdog.yml"
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: deriv-scanner-watchdog
  cancel-in-progress: false

jobs:
  monitor-and-recover:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check collector health and recover if stale
        uses: actions/github-script@v7
        with:
          script: |
            const workflowId = 417616657; // Multi-Timeframe Data Collector
            const branch = "main";
            const staleAfterMs = 10 * 60 * 1000;
            const now = Date.now();

            const response = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: workflowId,
              branch,
              per_page: 20
            });

            const latest = response.data.workflow_runs[0];

            if (!latest) {
              core.warning("No collector runs found. Dispatching a recovery run.");
              await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: workflowId,
                ref: branch
              });
              return;
            }

            if (latest.status === "queued" || latest.status === "in_progress") {
              core.notice(`Collector run #${latest.run_number} is ${latest.status}; no duplicate dispatched.`);
              return;
            }

            const lastActivity = Date.parse(latest.updated_at || latest.created_at);
            const ageMs = now - lastActivity;
            const stale = !Number.isFinite(lastActivity) || ageMs > staleAfterMs;
            const failed = latest.conclusion !== "success";

            if (stale || failed) {
              const reason = failed
                ? `Latest collector run concluded ${latest.conclusion || "without a conclusion"}`
                : `Latest collector run is stale (${Math.round(ageMs / 60000)} minutes since its last update)`;

              core.warning(`${reason}. Dispatching a recovery run.`);
              await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: workflowId,
                ref: branch
              });
            } else {
              core.notice(`Collector healthy: latest run #${latest.run_number} succeeded ${Math.round(ageMs / 60000)} minutes ago.`);
            }
