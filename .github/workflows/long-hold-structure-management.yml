name: Long-Hold Structure Management Experiment

on:
  push:
    branches: [dev/long-hold-structure-management-experiment]
  pull_request:
    branches: [dev/top-down-swing-precision-experiment]
    paths:
      - "top_down_swing_long_hold_replay.js"
      - "test/top_down_swing_long_hold_replay.test.js"
      - ".github/workflows/long-hold-structure-management.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  long-hold-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/long-hold-structure-management-experiment
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run long-hold policy tests
        run: node --test test/top_down_swing_long_hold_replay.test.js test/top_down_swing_engine.test.js
      - name: Collect fresh historical OHLC
        run: node top_down_swing_backfill.js
      - name: Compare 14-day management policies
        run: node top_down_swing_long_hold_replay.js top_down_swing_snapshot.json top_down_swing_long_hold_report.json
      - uses: actions/upload-artifact@v4
        with:
          name: long-hold-structure-management-report
          path: |
            top_down_swing_snapshot.json
            top_down_swing_long_hold_report.json
          retention-days: 30
