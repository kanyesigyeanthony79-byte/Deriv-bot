name: Multi-Timeframe Engine Tests

on:
  push:
    branches:
      - feature/multi-timeframe-engine
      - feature/phase1-market-regime-data-quality
      - feature/multi-timeframe-telegram-alerts
      - feature/swing-lower-timeframe-entry
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout development branch
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax check
        run: node --check multi_timeframe_engine.js && node --check market_quality.js && node --check multi_timeframe_alerts.js && node --check multi_timeframe_collector.js
      - name: Run unit tests
        run: node --test test/multi_timeframe_engine.test.js test/multi_timeframe_journal.test.js test/dashboard_syntax.test.js test/multi_timeframe_alerts.test.js
