name: Multi-Timeframe Engine Tests

on:
  push:
    branches:
      - feature/multi-timeframe-engine
      - feature/phase1-market-regime-data-quality
      - feature/multi-timeframe-telegram-alerts
      - feature/swing-lower-timeframe-entry
      - main
    paths:
      - "multi_timeframe_engine.js"
      - "workers/deriv-telegram-alerts/worker.js"
      - "DerivSignalAssistantV2_SignalBridge.mq5"
      - "market_quality.js"
      - "multi_timeframe_alerts.js"
      - "multi_timeframe_collector.js"
      - "strategy_comparison.js"
      - "breakout_retest_shadow.js"
      - "breakout_retest_m5_m15_shadow.js"
      - "strategy_comparison_alerts.js"
      - "tests/strategy_comparison_alerts.test.js"
      - "strategy_optimizer.js"
      - "test/strategy_optimizer.test.js"
      - "multi_timeframe_journal.js"
      - "multi_timeframe_dashboard.js"
      - "index.html"
      - "test/multi_timeframe_collector.test.js"
      - "test/multi_timeframe_engine.test.js"
      - "test/multi_timeframe_journal.test.js"
      - "test/dashboard_syntax.test.js"
      - "test/multi_timeframe_alerts.test.js"
      - "test/mt5_trade_reporting.test.mjs"
      - "test/strategy_comparison.test.js"
      - "test/breakout_retest_shadow.test.js"
      - "test/breakout_retest_m5_m15_shadow.test.js"
      - "test/m5_ema_pullback_shadow.test.js"
      - ".github/workflows/multi-timeframe-tests.yml"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout development branch
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax check
        run: node --check workers/deriv-telegram-alerts/worker.js && node --check multi_timeframe_engine.js && node --check market_quality.js && node --check multi_timeframe_alerts.js && node --check multi_timeframe_collector.js && node --check strategy_comparison.js && node --check strategy_matched_comparison.js && node --check lower_tf_entry_research.js && node --check lower_tf_common_assumption_replay.js && node --check strategy_comparison_alerts.js && node --check strategy_optimizer.js && node --check breakout_retest_shadow.js && node --check breakout_retest_m5_m15_shadow.js && node --check m5_ema_pullback_shadow.js
      - name: Run unit tests
        run: node --test test/mt5_trade_reporting.test.mjs test/multi_timeframe_collector.test.js test/multi_timeframe_engine.test.js test/multi_timeframe_journal.test.js test/dashboard_syntax.test.js test/multi_timeframe_alerts.test.js test/strategy_comparison.test.js test/strategy_matched_comparison.test.js test/lower_tf_common_assumption_replay.test.js test/strategy_optimizer.test.js test/breakout_retest_shadow.test.js test/breakout_retest_m5_m15_shadow.test.js test/m5_ema_pullback_shadow.test.js tests/strategy_comparison_alerts.test.js
