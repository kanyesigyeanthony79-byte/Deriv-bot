name: Swing Historical Validation

on:
  push:
    branches:
      - feature/swing-historical-validation
      - feature/swing-safety-reliability-fixes
      - dev/swing-h4-d1-m15-m5-refinement
      - dev/swing-trade-management-advisory
    paths:
      - "swing_historical_validation.js"
      - "swing_h4_d1_m15_m5.js"
      - "SWING_H4_D1_M15_M5_EXPERIMENT.md"
      - "multi_timeframe_engine.js"
      - "test/swing_historical_validation.test.js"
      - "test/swing_h4_d1_m15_m5.test.js"
      - "swing_trade_management.js"
      - "SWING_TRADE_MANAGEMENT_EXPERIMENT.md"
      - "test/swing_trade_management.test.js"
      - "test/swing_trade_management_replay.test.js"
      - "swing_trade_management_replay.js"
      - "swing_trade_management_diagnostics.js"
      - "test/swing_trade_management_diagnostics.test.js test/swing_reversal_sniper.test.js"
      - ".github/workflows/swing-historical-validation.yml"
  pull_request:
    branches:
      - dev/swing-h4-d1-m15-m5-refinement
    paths:
      - "swing_historical_validation.js"
      - "swing_h4_d1_m15_m5.js"
      - "SWING_H4_D1_M15_M5_EXPERIMENT.md"
      - "multi_timeframe_engine.js"
      - "test/swing_historical_validation.test.js"
      - "test/swing_h4_d1_m15_m5.test.js"
      - "swing_trade_management.js"
      - "SWING_TRADE_MANAGEMENT_EXPERIMENT.md"
      - "test/swing_trade_management.test.js"
      - "test/swing_trade_management_replay.test.js"
      - "swing_trade_management_replay.js"
      - "swing_trade_management_diagnostics.js"
      - "test/swing_trade_management_diagnostics.test.js"
      - ".github/workflows/swing-historical-validation.yml"
  workflow_dispatch:

concurrency:
  group: swing-historical-validation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout development branch
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check syntax
        run: |
          node --check swing_historical_validation.js
          node --check swing_h4_d1_m15_m5.js
          node --check swing_trade_management.js
          node --check swing_trade_management_replay.js
          node --check swing_trade_management_diagnostics.js\n          node --check swing_reversal_sniper.js
      - name: Test historical replay and refined swing candidate
        run: node --test test/swing_historical_validation.test.js test/swing_h4_d1_m15_m5.test.js test/swing_trade_management.test.js test/swing_trade_management_replay.test.js test/swing_trade_management_diagnostics.test.js
      - name: Fetch historical candles and replay swing entries
        run: node swing_historical_validation.js
      - name: Upload historical validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swing-historical-validation
          path: swing_historical_validation.json
          if-no-files-found: error
          retention-days: 30
