name: Swing Historical Validation

on:
  push:
    branches:
      - feature/swing-historical-validation
      - feature/swing-safety-reliability-fixes
    paths:
      - "swing_historical_validation.js"
      - "swing_identical_candle_comparison.js"
      - "test/fixtures/multi_timeframe_engine.baseline.js"
      - "test/swing_identical_candle_comparison.test.js"
      - "multi_timeframe_engine.js"
      - "test/swing_historical_validation.test.js"
      - ".github/workflows/swing-historical-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout development branch
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check syntax
        run: node --check swing_historical_validation.js
      - name: Test conservative outcome replay
        run: node --test test/swing_historical_validation.test.js
      - name: Fetch historical candles and replay swing entries
        run: node swing_historical_validation.js
      - name: Compare PR9 and PR11 on identical candle snapshots
        run: node swing_identical_candle_comparison.js
      - name: Test paired comparison
        run: node --test test/swing_identical_candle_comparison.test.js
      - name: Upload historical validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swing-historical-validation
          path: |
            swing_historical_validation.json
            swing_historical_snapshots.json
            swing_identical_candle_comparison.json
          if-no-files-found: error
          retention-days: 30
