name: Capture synthetic reversal replay candles

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Historical window (7-30 days)"
        required: true
        default: "14"
  push:
    branches: [research/reversal-candle-capture]
    paths:
      - "scripts/fetch_reversal_candles.js"
      - ".github/workflows/reversal-candle-capture.yml"

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Capture public Deriv candle history
        env:
          REPLAY_DAYS: ${{ github.event.inputs.days || '14' }}
        run: node scripts/fetch_reversal_candles.js
      - name: Upload immutable replay input
        uses: actions/upload-artifact@v4
        with:
          name: reversal-candles-${{ github.run_id }}
          path: research/data/*.json
          if-no-files-found: error
          retention-days: 30
