name: Volatility 10 Transition Forward Test
run-name: "${{ inputs.trigger_source || 'manual' }} — Volatility 10 Transition Forward Test"

on:
  workflow_dispatch:
    inputs:
      trigger_source:
        description: "Dispatch source label"
        required: false
        default: "manual"
        type: string
      provider_enabled:
        description: "Paper provider gate supplied by the Cloudflare scheduler"
        required: false
        default: "false"
        type: string
      emergency_kill_switch:
        description: "Emergency stop supplied by the Cloudflare scheduler"
        required: false
        default: "true"
        type: string
      telegram_enabled:
        description: "Allow this scanner run to request forward-test Telegram delivery"
        required: false
        default: "false"
        type: string
      route_enabled:
        description: "Worker-side R10 forward-test route gate"
        required: false
        default: "false"
        type: string
      legacy_rollback_enabled:
        description: "Restore the previous R10 EMA/ATR paper scanner without restoring broker execution"
        required: false
        default: "false"
        type: string

permissions:
  contents: write

concurrency:
  group: deriv-signal-scanners
  cancel-in-progress: false

jobs:
  paper-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run complete repository test suite
        run: npm test
      - name: Run frozen R10 scanner or explicitly selected legacy rollback
        run: |
          if [ "$R10_LEGACY_ROLLBACK_ENABLED" = "true" ]; then
            node volatility10_paper_scanner.js
          else
            node volatility10_transition_forward_scanner.js
          fi
        env:
          R10_PAPER_RUN_SECONDS: "30"
          R10_PAPER_PROVIDER_ENABLED: ${{ inputs.provider_enabled || 'false' }}
          R10_PAPER_ROUTE_ENABLED: ${{ inputs.route_enabled || 'false' }}
          R10_EMERGENCY_KILL_SWITCH: ${{ inputs.emergency_kill_switch || 'true' }}
          R10_PAPER_TELEGRAM_ENABLED: ${{ inputs.telegram_enabled || 'false' }}
          R10_LEGACY_ROLLBACK_ENABLED: ${{ inputs.legacy_rollback_enabled || 'false' }}
          TELEGRAM_WORKER_URL: ${{ secrets.TELEGRAM_WORKER_URL }}
          SIGNAL_API_KEY: ${{ secrets.SIGNAL_API_KEY }}
      - name: Persist paper journal
        if: always()
        run: |
          git config user.name "Volatility 10 Paper Scanner"
          git config user.email "actions@users.noreply.github.com"
          git add volatility10_transition_forward_state.json volatility10_transition_forward_journal.json volatility10_paper_state.json volatility10_paper_journal.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Volatility 10 paper journal"
            pushed=false
            for attempt in 1 2 3; do
              git fetch origin "$GITHUB_REF_NAME"
              git rebase "origin/$GITHUB_REF_NAME"
              if git push origin "HEAD:$GITHUB_REF_NAME"; then
                pushed=true
                break
              fi
              echo "Journal push raced with another main update (attempt $attempt); retrying."
              sleep $((attempt * 2))
            done
            if [ "$pushed" != "true" ]; then
              echo "Unable to persist R10 paper journal after three attempts."
              exit 1
            fi
          fi
