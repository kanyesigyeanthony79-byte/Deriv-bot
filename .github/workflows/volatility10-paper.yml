name: Volatility 10 M1 Paper Scanner
run-name: "${{ inputs.trigger_source || 'manual' }} — Volatility 10 M1 Paper Scanner"

on:
  workflow_dispatch:
    inputs:
      trigger_source:
        description: "Dispatch source label"
        required: false
        default: "manual"
        type: string
      provider_enabled:
        description: "Paper provider gate supplied by the Cloudflare scheduler"
        required: false
        default: "false"
        type: string
      emergency_kill_switch:
        description: "Emergency stop supplied by the Cloudflare scheduler"
        required: false
        default: "true"
        type: string
      telegram_enabled:
        description: "Paper Telegram route gate supplied by the Cloudflare scheduler"
        required: false
        default: "false"
        type: string

permissions:
  contents: write

concurrency:
  group: volatility10-m1-paper-scanner
  cancel-in-progress: false

jobs:
  paper-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run Volatility 10 strategy tests
        run: node --test test/volatility10_ema_atr_slope20.test.js
      - name: Run paper-only M1 scanner window
        run: node volatility10_paper_scanner.js
        env:
          R10_PAPER_RUN_SECONDS: "30"
          R10_PAPER_PROVIDER_ENABLED: ${{ inputs.provider_enabled || 'false' }}
          R10_PAPER_ROUTE_ENABLED: "true"
          R10_EMERGENCY_KILL_SWITCH: ${{ inputs.emergency_kill_switch || 'true' }}
          R10_PAPER_TELEGRAM_ENABLED: ${{ inputs.telegram_enabled || 'false' }}
          TELEGRAM_WORKER_URL: ${{ secrets.TELEGRAM_WORKER_URL }}
          SIGNAL_API_KEY: ${{ secrets.SIGNAL_API_KEY }}
      - name: Persist paper journal
        if: always()
        run: |
          git config user.name "Volatility 10 Paper Scanner"
          git config user.email "actions@users.noreply.github.com"
          git add volatility10_paper_state.json volatility10_paper_journal.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Volatility 10 paper journal"
            pushed=false
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                pushed=true
                break
              fi
              echo "Journal push raced with another main update (attempt $attempt); retrying."
              sleep $((attempt * 2))
            done
            if [ "$pushed" != "true" ]; then
              echo "Unable to persist R10 paper journal after three attempts."
              exit 1
            fi
          fi
