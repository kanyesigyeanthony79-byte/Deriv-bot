name: Market Regime Shadow Tests
on:
  push:
    branches: [main]
    paths:
      - "market_regime_filter_shadow.js"
      - "test/market_regime_filter_shadow.test.js"
      - ".github/workflows/market-regime-filter-tests.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test test/market_regime_filter_shadow.test.js
