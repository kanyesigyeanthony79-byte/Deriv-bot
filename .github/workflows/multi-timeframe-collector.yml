name: Multi-Timeframe Data Collector
run-name: "[${{ inputs.trigger_source || 'manual' }}] Multi-Timeframe Data Collector"

on:
  push:
    branches:
      - main
    paths:
      - "multi_timeframe_collector.js"
      - "workers/deriv-telegram-alerts/worker.js"
      - "DerivSignalAssistantV2_SignalBridge.mq5"
      - "index.html"
      - "multi_timeframe_journal.js"
      - "strategy_version_performance.js"
      - "daily_performance_archive.js"
      - "daily_performance_archive.test.js"
      - "daily-performance-archive.html"
      - "multi_timeframe_engine.js"
      - "multi_timeframe_alerts.js"
      - "strategy_comparison.js"
      - "breakout_retest_shadow.js"
      - "m5_ema_pullback_shadow.js"
      - "breakout_retest_m5_m15_shadow.js"
      - "strategy_comparison_alerts.js"
      - "strategy_optimizer.js"
      - "signal_review.js"
  workflow_dispatch:
    inputs:
      trigger_source:
        description: "Dispatch source label"
        required: false
        default: "manual"
        type: string

permissions:
  contents: write

concurrency:
  group: deriv-signal-scanners
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout development branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Collect candles and route recent candidates to Telegram
        run: node multi_timeframe_collector.js
        env:
          MTF_TELEGRAM_ALERTS: ${{ github.ref == 'refs/heads/main' && 'true' || 'false' }}
          STRATEGY_COMPARISON_TELEGRAM_ALERTS: ${{ github.ref == 'refs/heads/main' && 'true' || 'false' }}
          TELEGRAM_WORKER_URL: ${{ secrets.TELEGRAM_WORKER_URL }}
          SIGNAL_API_KEY: ${{ secrets.SIGNAL_API_KEY }}
          MT5_TRADE_REPORTING_ENABLED: ${{ github.ref == 'refs/heads/main' && 'true' || 'false' }}
          MT5_EXECUTION_QUEUE_ENABLED: 'false' # Signal-only mode: never enqueue MT5 orders from this workflow
      - name: Archive lower-timeframe candles for entry research
        run: node lower_tf_entry_research.js
        env:
          LOWER_TF_FOCUS_MARKET: R_10
      - name: Run common-assumption historical replay when data is ready
        run: node lower_tf_common_assumption_replay.js
      - name: Build historical daily performance archive
        run: node daily_performance_archive.js
      - name: Persist isolated observation journal
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add daily_performance_archive.json multi_timeframe_journal.json multi_timeframe_dashboard.json signal_review_data.json strategy_version_performance_report.json strategy_matched_comparison_report.json strategy_comparison_journal.json strategy_research_candles.json strategy_research_report.json lower_tf_research_candles.json lower_tf_entry_research_report.json lower_tf_common_assumption_replay_report.json breakout_retest_shadow_journal.json m5_ema_pullback_shadow_journal.json breakout_retest_m5_m15_shadow_journal.json
          if ! git diff --cached --quiet; then
            git commit -m "Update multi-timeframe observation journal"
            for attempt in 1 2 3; do
              git fetch origin "$GITHUB_REF_NAME"
              git rebase "origin/$GITHUB_REF_NAME"
              if git push origin "HEAD:$GITHUB_REF_NAME"; then exit 0; fi
              sleep 2
            done
            exit 1
          fi
      - name: Upload observation data
        uses: actions/upload-artifact@v4
        with:
          name: multi-timeframe-observation-data
          path: multi_timeframe_data.json
          if-no-files-found: error
          retention-days: 7
