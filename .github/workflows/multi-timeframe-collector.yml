name: Multi-Timeframe Data Collector

on:
  push:
    branches:
      - main
    paths:
      - "multi_timeframe_collector.js"
      - "multi_timeframe_engine.js"
      - "multi_timeframe_alerts.js"\n      - "signal_review.js"
      - ".github/workflows/multi-timeframe-collector.yml"
  workflow_dispatch:
  schedule:
    - cron: "2-59/5 * * * *"

permissions:
  contents: write

concurrency:
  group: multi-timeframe-observation-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout development branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Collect candles and route recent candidates to Telegram
        run: node multi_timeframe_collector.js
        env:
          MTF_TELEGRAM_ALERTS: ${{ github.ref == 'refs/heads/main' && 'true' || 'false' }}
          TELEGRAM_WORKER_URL: ${{ secrets.TELEGRAM_WORKER_URL }}
          SIGNAL_API_KEY: ${{ secrets.SIGNAL_API_KEY }}
      - name: Persist isolated observation journal
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add multi_timeframe_journal.json multi_timeframe_dashboard.json signal_review_data.json
          if ! git diff --cached --quiet; then
            git commit -m "Update multi-timeframe observation journal"
            for attempt in 1 2 3; do
              git fetch origin "$GITHUB_REF_NAME"
              git rebase "origin/$GITHUB_REF_NAME"
              if git push origin "HEAD:$GITHUB_REF_NAME"; then exit 0; fi
              sleep 2
            done
            exit 1
          fi
      - name: Upload observation data
        uses: actions/upload-artifact@v4
        with:
          name: multi-timeframe-observation-data
          path: multi_timeframe_data.json
          if-no-files-found: error
          retention-days: 7
