name: Hosted Scanner Journal Tests

on:
  pull_request:
    branches:
      - main
    paths:
      - "hosted_scanner.js"
      - "index.html"
      - "signal_journal.js"
      - "daily_summary.js"
      - "test/daily_summary.test.js"
      - "priority_pairs.js"
      - "test/priority_pairs.test.js"
      - "workers/deriv-telegram-alerts/worker.js"
      - "cloudflare/deriv-telegram-alerts.js"
      - "volatility10_ema_atr_slope20.js"
      - "volatility10_provider_config.js"
      - "volatility10_paper_scanner.js"
      - "test/volatility10_ema_atr_slope20.test.js"
      - "test/signal_journal.test.js"
      - ".github/workflows/hosted-scanner-tests.yml"
  push:
    branches:
      - fix/hosted-scanner-journal-expiry
      - fix/daily-summary-retry-main
      - main
    paths:
      - "hosted_scanner.js"
      - "index.html"
      - "signal_journal.js"
      - "daily_summary.js"
      - "test/daily_summary.test.js"
      - "test/signal_journal.test.js"
      - ".github/workflows/hosted-scanner-tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check syntax
        run: node --check hosted_scanner.js && node --check signal_journal.js && node --check daily_summary.js && node --check priority_pairs.js && node --check workers/deriv-telegram-alerts/worker.js && node --check cloudflare/deriv-telegram-alerts.js && node --check volatility10_ema_atr_slope20.js && node --check volatility10_provider_config.js && node --check volatility10_paper_scanner.js && node --input-type=module --check < cloudflare/deriv-mtf-watchdog.js
      - name: Run journal tests
        run: node --test test/signal_journal.test.js test/daily_summary.test.js test/priority_pairs.test.js test/volatility10_ema_atr_slope20.test.js
