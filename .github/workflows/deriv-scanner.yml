name: Deriv Hosted Scanner

on:
  push:
    branches:
      - main
    paths:
      - "hosted_scanner.js"
      - "signal_journal.js"
      - ".github/workflows/deriv-scanner.yml"
  workflow_dispatch:
  schedule:
    # Offset away from the start of each hour to reduce GitHub scheduler congestion.
    # GitHub-hosted cron events can still be delayed or dropped during high load.
    - cron: "2-59/5 * * * *"

permissions:
  contents: write

concurrency:
  group: deriv-hosted-scanner
  cancel-in-progress: false

jobs:
  scanner:
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run signal-only Deriv scanner
        run: node hosted_scanner.js
        env:
          TELEGRAM_WORKER_URL: ${{ secrets.TELEGRAM_WORKER_URL }}
          SIGNAL_API_KEY: ${{ secrets.SIGNAL_API_KEY }}

      - name: Save signal history
        run: |
          git config user.name "Deriv Scanner"
          git config user.email "actions@users.noreply.github.com"
          git add signal_state.json trade_journal.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Deriv signal history"
            git push
          fi
