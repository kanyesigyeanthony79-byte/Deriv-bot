name: Deriv Market Monitor

on:
  push:
    branches:
      - main
    paths:
      - "hosted_scanner.js"
      - "scanner_heartbeat.js"
      - "signal_journal.js"
      - "daily_summary.js"
      - "multi_timeframe_journal.json"
      - ".github/workflows/deriv-scanner.yml"
  workflow_dispatch:
  schedule:
    # Offset away from the start of each hour to reduce GitHub scheduler congestion.
    # GitHub-hosted cron events can still be delayed or dropped during high load.
    - cron: "2-59/5 * * * *"

permissions:
  contents: write

concurrency:
  group: deriv-hosted-scanner
  cancel-in-progress: false

jobs:
  scanner:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run signal-only Deriv market monitor
        run: node hosted_scanner.js
        env:
          TELEGRAM_WORKER_URL: ${{ secrets.TELEGRAM_WORKER_URL }}
          SIGNAL_API_KEY: ${{ secrets.SIGNAL_API_KEY }}
          DERIV_TOKEN: ${{ secrets.DERIV_TOKEN }}
          DERIV_ACCOUNT_ID: ${{ secrets.DERIV_ACCOUNT_ID }}
          DERIV_APP_ID: ${{ secrets.DERIV_APP_ID }}

      - name: Save signal history
        if: always()
        run: |
          git config user.name "Deriv Scanner"
          git config user.email "actions@users.noreply.github.com"
          git add signal_state.json trade_journal.json scanner_heartbeat.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Deriv signal history"
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then exit 0; fi
              sleep 2
            done
            exit 1
          fi
