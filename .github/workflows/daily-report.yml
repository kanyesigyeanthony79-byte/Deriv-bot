name: Deriv Daily Telegram Report

on:
  # Uganda is UTC+3. First attempt at 00:15 EAT, then retry every 15 minutes
  # through 05:45 EAT if Telegram delivery or an upstream journal commit is delayed.
  schedule:
    - cron: "15,30,45 21-23 * * *"
    - cron: "0,15,30,45 0-2 * * *"
  workflow_dispatch:

permissions:
  contents: write

# Share the scanner's lock because both workflows update trade_journal.json.
concurrency:
  group: deriv-hosted-scanner
  cancel-in-progress: false

jobs:
  daily-report:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check JavaScript syntax
        run: node --check daily_report_runner.js && node --check daily_summary.js

      - name: Generate and deliver daily report
        run: node daily_report_runner.js
        env:
          TELEGRAM_WORKER_URL: ${{ secrets.TELEGRAM_WORKER_URL }}
          SIGNAL_API_KEY: ${{ secrets.SIGNAL_API_KEY }}
          DERIV_TOKEN: ${{ secrets.DERIV_TOKEN }}
          DERIV_ACCOUNT_ID: ${{ secrets.DERIV_ACCOUNT_ID }}
          DERIV_APP_ID: ${{ secrets.DERIV_APP_ID }}

      - name: Save confirmed delivery record
        run: |
          git config user.name "Deriv Daily Reporter"
          git config user.email "actions@users.noreply.github.com"
          git add trade_journal.json
          if ! git diff --cached --quiet; then
            git commit -m "Record daily Telegram report delivery"
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then exit 0; fi
              sleep 2
            done
            exit 1
          fi
